<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <title>Brogue Mini</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      flex-direction: column;
      touch-action: none;
      overflow: hidden;
    }
    canvas {
      border: 1px solid #1a1a2e;
      max-width: 100%;
      display: block;
      margin: 0 auto;
    }
    .controls {
      color: #555;
      font: 8px 'Press Start 2P', monospace;
      margin-top: 8px;
      text-align: center;
      width: 100%;
      line-height: 1.8;
    }
    /* Touch controls container */
    #touch-controls {
      display: none;
      width: 100%;
      max-width: 800px;
      margin: 4px auto 0;
      padding: 0 4px;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
    }
    #touch-controls.visible {
      display: flex;
    }
    /* D-pad grid */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      flex-shrink: 0;
    }
    .dpad button {
      width: 48px;
      height: 48px;
      border: 1px solid #333;
      background: rgba(30, 30, 50, 0.85);
      color: #aaa;
      font: 16px 'Press Start 2P', monospace;
      border-radius: 6px;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      line-height: 48px;
    }
    .dpad button:active {
      background: rgba(60, 60, 100, 0.9);
      color: #fff;
    }
    .dpad button.center-btn {
      background: rgba(50, 50, 80, 0.85);
      color: #888;
    }
    /* Action buttons */
    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      flex-shrink: 0;
    }
    .actions button {
      min-width: 56px;
      height: 48px;
      border: 1px solid #333;
      background: rgba(30, 30, 50, 0.85);
      color: #aaa;
      font: 8px 'Press Start 2P', monospace;
      border-radius: 6px;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      padding: 0 6px;
      line-height: 1.4;
    }
    .actions button:active {
      background: rgba(60, 60, 100, 0.9);
      color: #fff;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="controls">
    Move: arrows / hjkl / yubn (diagonal) &nbsp;|&nbsp;
    Descend: &gt; &nbsp;|&nbsp;
    Wait: space &nbsp;|&nbsp;
    Restart: r &nbsp;|&nbsp;
    Language: F1
  </div>
  <div id="touch-controls">
    <div class="dpad">
      <button data-dir="-1,-1">\</button>
      <button data-dir="0,-1">^</button>
      <button data-dir="1,-1">/</button>
      <button data-dir="-1,0">&lt;</button>
      <button class="center-btn" data-action="wait">.</button>
      <button data-dir="1,0">&gt;</button>
      <button data-dir="-1,1">/</button>
      <button data-dir="0,1">v</button>
      <button data-dir="1,1">\</button>
    </div>
    <div class="actions">
      <button data-action="stairs">&gt; Stair</button>
      <button data-action="inventory">[ Inv</button>
      <button data-action="pickup">g Pick</button>
      <button data-action="auto">x Auto</button>
    </div>
  </div>
  <script src="dist/game.js"></script>
</body>
</html>
